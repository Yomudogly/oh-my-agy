name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Selftest & Skill Eval (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: ['20']

    steps:
      - name: Enforce LF line endings before checkout
        shell: bash
        run: git config --global core.autocrlf false

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run lifecycle hooks & CLI selftest
        shell: bash
        run: |
          out=$(sh ./hooks/run.sh selftest)
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -Fq '"selftest":"PASS"'

      - name: Run skill routing evaluation ratchet
        shell: bash
        run: sh ./hooks/run.sh skill-eval --min-rank1 95

      - name: Run HUD sidecar selftest
        shell: bash
        run: |
          out=$(sh ./sidecars/hud/run.sh selftest)
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -Fq '"selftest":"PASS"'
